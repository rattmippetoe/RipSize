name: Build RecognizeSize Beta

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unpack tested RecognizeSize beta source
        run: |
          echo 'ca40e9cd85cef06a74420b6a33010b8f72debaa9008ced0421c0248613a600d6  ci-payload/RecognizeSize_overlay.tar.xz' | sha256sum --check
          tar -xJf ci-payload/RecognizeSize_overlay.tar.xz
          python3 -m json.tool PluginConfig.json >/dev/null
          grep -q '"pluginKey": "recognizesize"' PluginConfig.json
      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.1.12297006'
      - name: Install pinned React Native and plugin dependencies
        run: |
          npm pkg set name=recognizesize version=0.1.0-beta
          npm pkg set dependencies.react-native-fs=2.20.0 dependencies.i18next=24.2.3 dependencies.react-i18next=15.7.0
          npm install --legacy-peer-deps --no-audit --no-fund
          node -e "const p=require('./package.json'); if (p.dependencies.react!=='19.0.0'||p.dependencies['react-native']!=='0.79.2') process.exit(1)"
      - name: Build Supernote installer
        run: |
          chmod +x ./buildPlugin.sh
          ./buildPlugin.sh
      - name: Validate installer archive
        run: |
          python3 - <<'PY'
          import glob, json, zipfile
          files=glob.glob('build/outputs/*.snplg')
          assert len(files)==1, f'Expected one installer, got: {files}'
          with zipfile.ZipFile(files[0]) as z:
              names=z.namelist()
              print('Installer:',files[0], 'entries:', names)
              assert 'PluginConfig.json' in names, 'Missing package manifest'
              cfg=json.loads(z.read('PluginConfig.json'))
              assert cfg['pluginID']=='rcsz9m4n2p7w8q1a', 'Plugin ID mismatch'
              assert cfg['pluginKey']=='recognizesize', 'Wrong component key'
              assert any(n.endswith('.bundle') for n in names), 'Missing JS bundle'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RecognizeSize-v0.1.0-beta-snplg
          path: build/outputs/*.snplg
          if-no-files-found: error
